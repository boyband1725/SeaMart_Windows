name: Build SeaMart POS V15 Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seamart.py'
      - 'requirements.txt'
      - 'SeaMartPOSV15.iss'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile seamart.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SeaMartPOSV15 seamart.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: '& "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" SeaMartPOSV15.iss'
        shell: pwsh
      - name: Verify installer
        run: if (!(Test-Path 'Output/SeaMartPOSV15-Setup.exe')) { throw 'Installer tidak ditemukan' }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: SeaMartPOSV15-Setup
          path: Output/SeaMartPOSV15-Setup.exe
          if-no-files-found: error
